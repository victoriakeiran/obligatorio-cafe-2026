<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema web para la gestión de productos, vendedores y ventas de Obligatorio Café">
    <title>Obligatorio Café | Cafetería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="fondo">
    <header class="encabezado">
        <div class="encabezado-mobile">
        <h1>Obligatorio Café</h1>
    <button class="menu-hamburguesa" type="button">☰</button>
</div>
        <nav class="btnPrincipales">
            <a href="./productos.html">Productos</a>
            <a href="./vendedores.html">Vendedores</a>
            <a href="./ventas.html">Ventas</a>
            <a href="./estadisticas.html">Estadisticas</a>
            <a href="./clima.html">Clima</a>
        </nav>
    </header>

    <main class="contenedorCafeteria">
        <section class="contenedorCarteles tarjetaCafeteria">
            <div class="cartel">
                <div>
                    <img src="./imagenes/cafe-en-grano.webp" alt="Cafe en Grano">
                </div>
                <div class="contenido">
                    <h2>Café en Grano</h2>
                </div>
            </div>

            <div class="cartel">
                <div>
                    <img src="./imagenes/cafe-molido.webp" alt="Cafe Molido">
                </div>
                <div class="contenido">
                    <h2>Café Molido</h2>
                </div>
            </div>

            <div class="cartel">
                <div>
                    <img src="./imagenes/cafetera-italiana.webp" alt="Cafetera Italiana">
                </div>
                <div class="contenido">
                    <h2>Cafetera Italiana</h2>
                </div>
            </div>

            <div class="cartel">
                <div>
                    <img src="./imagenes/cafetera-prensa.webp" alt="Cafetera Prensa">
                </div>
                <div class="contenido">
                    <h2>Cafetera Prensa</h2>
                </div>
            </div>

            <div class="cartel">
                <div class="grid-item">
                    <img src="./imagenes/capsulas.webp" alt="Capsulas">
                </div>
                <div class="contenido">
                    <h2>Capsulas</h2>
                </div>
            </div>

            <div class="cartel">
                <div>
                    <img src="./imagenes/pack-de-te.webp" alt="Pack de Té">
                </div>
                <div class="contenido">
                    <h2>Pack de Té</h2>
                </div>
            </div>

            <div class="cartel">
                <div>
                    <img src="./imagenes/pack-productos.webp" alt="Pack Productos">
                </div>
                <div class="contenido">
                    <h2>Pack de Productos</h2>
                </div>
            </div>

        </section>
    </main>
    <script>
        document.querySelector(".menu-hamburguesa").addEventListener("click", function() {
        document.querySelector(".btnPrincipales").classList.toggle("menu-abierto");
    });
</script>
</body>
</html>
