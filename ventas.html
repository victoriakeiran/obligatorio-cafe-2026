<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <script src="./dominio/memoria.js"></script>
    <script src="./dominio/venta.js"></script>
    <script src="./dominio/cafeteria.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body onload="CargoDatosVentas()" class="fondo">
    <header class="encabezado">
        <h1>Obligatorio Café</h1>
        <nav class="btnPrincipales">
            <a href="./cafeteria.html">Principal</a>
            <a href="./productos.html">Productos</a>
            <a href="./vendedores.html">Vendedores</a>
            <a href="./estadisticas.html">Estadisticas</a>
        </nav>
    </header>

    <main class="contenedorTarjeta">
        <section class="tarjeta">
            <h2 class="titulo">Registro de ventas</h2>
                <form>
                    <div class="campos">
                        <label for="codigo">Código:</label>
                        <input type="number" id="codigo">

                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha">

                        <label for="vendedor">Vendedor: </label>
                        <select id="codigo-vendedor"></select>

                        <label for="producto">Producto: </label>
                        <select id="codigo-producto" onchange="CargarPrecioProducto()"></select>

                        <label for="precio">Precio: </label>
                        <input type="number" id="precio-producto" disabled>
                        
                        <label for="cantidad">Cantidad: </label>
                        <input type="number" id="cantidad" onblur="CalculoTotal()">

                        <label for="total">Total: </label>
                        <input type="text" id="total" disabled>
                    </div>

                    <div class="botones">
                        <input class="boton btn_agregar" type="button" value="Agregar" onclick="AgregarVenta()">
                        <!--<input class="boton btn_modificar" type="button" value="Modificar" onclick="ModificarVenta()">-->
                        <input class="boton btn_eliminar" type="button" value="Eliminar" onclick="EliminarVenta()">
                        <input class="boton btn_limpiar" type="button" value="Limpiar" onclick="InicializarVenta()">
                    </div>
                </form>
        </section>

        <section class="tarjeta listado">
            <h2 class="titulo">Listado de ventas</h2>
            <select id="lista-ventas" onchange="SeleccionarVenta()" size="6"></select>
        </section>
    </main>
</body>
</html>
