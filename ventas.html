<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <script type="module" src="./dominio/ventaControlador.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="fondo">
    <header class="encabezado">
        <h1>Obligatorio Café</h1>
        <nav class="btnPrincipales">
            <a href="./cafeteria.html">Principal</a>
            <a href="./productos.html">Productos</a>
            <a href="./vendedores.html">Vendedores</a>
            <a href="./estadisticas.html">Estadisticas</a>
            <a href="./clima.html">Clima</a>
        </nav>
    </header>

    <main class="contenedorTarjeta">
        <section class="tarjeta">
            <h2 class="titulo">Registro de ventas</h2>
                <form>
                    <div class="campos">
                        <label for="codigo">Código:</label>
                        <input type="number" id="codigo">
                        <small id="error-codigo" class="error"></small>

                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha">
                        <small id="error-fecha" class="error"></small>

                        <label for="vendedor">Vendedor:</label>
                        <select id="codigo-vendedor"></select>
                        <small id="error-codigo-vendedor" class="error"></small>

                        <label for="producto">Producto:</label>
                        <select id="codigo-producto"></select>
                        <small id="error-codigo-producto" class="error"></small>

                        <label for="precio">Precio:</label>
                        <input type="number" id="precio-producto" disabled>

                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad">
                        <small id="error-cantidad" class="error"></small>

                        <label for="total">Total:</label>
                        <input type="text" id="total" disabled>
                    </div>

                    <div class="botones" id="botones-ventas">
                        <input id="btnAgregar" class="boton btn_agregar" type="button" value="Agregar">
                        <input id="btnEliminar" class="boton btn_eliminar" type="button" value="Eliminar">
                        <input id="btnLimpiar" class="boton btn_limpiar" type="button" value="Limpiar">
                    </div>
                </form>
        </section>

        <section class="tarjeta listado">
            <h2 class="titulo">Listado de ventas</h2>
            <select id="lista-ventas" size="6"></select>
            <small id="error-lista-ventas" class="error"></small>
        </section>
    </main>
</body>
</html>
