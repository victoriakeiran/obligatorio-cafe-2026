<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestión de productos de Obligatorio Café">
    <title>Obligatorio Café | Productos</title>
    <script type="module" src="./dominio/productoControlador.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="fondo">
    <header class="encabezado">
        <div class="encabezado-mobile">
            <h1>Obligatorio Café</h1>
            <button class="menu-hamburguesa" type="button" aria-label="Abrir menú de navegación">☰</button>
        </div>    
        <nav class="btnPrincipales">
            <a href="./cafeteria.html">Principal</a>
            <a href="./vendedores.html">Vendedores</a>
            <a href="./ventas.html">Ventas</a>
            <a href="./estadisticas.html">Estadisticas</a>
            <a href="./clima.html">Clima</a>
        </nav>
    </header>

    <main class="contenedorTarjeta">
        <section class="tarjeta">
            <h2 class="titulo">ABM Productos</h2>
            <form>
                <div class="campos">
                    <label for="codigo">Código:</label>
                    <input type="number" id="codigo">
                    <small id="error-codigo" class="error"></small>

                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre">
                    <small id="error-nombre" class="error"></small>

                    <label for="descripcion">Descripcion</label>
                    <textarea id="descripcion" rows="4"></textarea>
                    <small id="error-descripcion" class="error"></small>

                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" min="0">
                    <small id="error-precio" class="error"></small>

                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" min="1" step="1">
                    <small id="error-stock" class="error"></small>
                </div>

                <div class="botones" id="botones-productos">
                    <input id="btnAgregar" class="boton" type="button" value="Agregar">
                    <input id="btnModificar" class="boton" type="button" value="Modificar">
                    <input id="btnEliminar" class="boton" type="button" value="Eliminar">
                    <input id="btnLimpiar" class="boton" type="button" value="Limpiar">
                </div>
            </form>
        </section>

        <section class="tarjeta listado">
            <h2 class="titulo">Listado de Productos</h2>
            <label for="lista-productos"></label>
            <select id="lista-productos" size="6"></select>
            <small id="error-lista-productos" class="error"></small>
        </section>
    </main>
    <div id="modal-mensaje" class="modal-mensaje">
        <div class="modal-contenido">
            <div class="modal-icono">☕</div>
            <h2>Obligatorio Café</h2>
            <p id="texto-modal"></p>
            <button id="btnCerrarModal" class="boton" type="button">Aceptar</button>
        </div>
    </div>
<script>
    document.querySelector(".menu-hamburguesa").addEventListener("click", function() {
        document.querySelector(".btnPrincipales").classList.toggle("menu-abierto");
    });

    function MostrarModal(mensaje) {
        document.getElementById("texto-modal").textContent = mensaje;
        document.getElementById("modal-mensaje").classList.add("mostrar");
    }

    function CerrarModal() {
        document.getElementById("modal-mensaje").classList.remove("mostrar");
    }

    document.getElementById("btnCerrarModal").addEventListener("click", CerrarModal);

    document.addEventListener("keydown", function(event) {
        if (
            event.key === "Enter" &&
            document.getElementById("modal-mensaje").classList.contains("mostrar")
        ) {
            CerrarModal();
        }
    });
</script>
</body>
</html>
