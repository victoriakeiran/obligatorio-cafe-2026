<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Estadísticas de ventas, productos y vendedores de Obligatorio Café">
    <title>Obligatorio Café | Estadísticas</title>
    <script type="module" src="./dominio/estadisticaControlador.js"></script>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="fondo">
    <header class="encabezado">
        <div class="encabezado-mobile">
            <h1>Obligatorio Café</h1>
            <button class="menu-hamburguesa" type="button" aria-label="Abrir menú de navegación">☰</button>
        </div>
        <nav class="btnPrincipales">
            <a href="./cafeteria.html">Principal</a>
            <a href="./productos.html">Productos</a>
            <a href="./vendedores.html">Vendedores</a>
            <a href="./ventas.html">Ventas</a>
            <a href="./clima.html">Clima</a>
        </nav>
    </header>
        
    <main class="contenedorTarjeta">
        <section class="tarjeta">
            <h2 class="titulo">Estadísticas</h2>
                <form>
                    <div class="campos">
                        <label for="totalRecaudado">Total recaudado: </label>
                        <input type="text" id="totalRecaudado" disabled>

                        <label for="masVendido">Producto más vendido: </label>
                        <input type="text" id="masVendido" disabled>

                        <label for="mejorVendedor">Mejor vendedor: </label>
                        <input type="text" id="mejorVendedor" disabled>
                    </div>
                </form>
        </section>

        <div class="tarjeta listado">
            <h2 class="titulo">Productos con Stock</h2>
            <select id="productos-con-stock" size="6" aria-label="Productos con stock"></select>
        </div>
    </main>
<script>
    document.querySelector(".menu-hamburguesa").addEventListener("click", function() {
    document.querySelector(".btnPrincipales").classList.toggle("menu-abierto");
});
</script>
</body>
</html>
