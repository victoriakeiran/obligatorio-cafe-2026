<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulta del clima por ciudad en Obligatorio Café">
    <title>Obligatorio Café | Clima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body class="fondo">
    <header class="encabezado">
        <div class="encabezado-mobile">
            <h1>Obligatorio Café</h1>
            <button class="menu-hamburguesa" type="button" aria-label="Abrir menú de navegación">☰</button>
        </div>
        <nav class="btnPrincipales">
            <a href="./cafeteria.html">Principal</a>
            <a href="./productos.html">Productos</a>
            <a href="./vendedores.html">Vendedores</a>
            <a href="./ventas.html">Ventas</a>
            <a href="./estadisticas.html">Estadisticas</a>
        </nav>
    </header>

    <main class="container py-4">
        <div class="encabezado-pagina">
            <h2>Clima</h2>
        </div>

        <div id="mensaje" class="alert d-none" role="alert"></div>

        <section class="row g-4">
            <div class="col-12 col-lg-4">
                <form class="panel">
                    <h3 class="h5">Consultar ciudad</h3>

                    <label class="form-label" for="ciudad">Ciudad</label>
                    <select class="form-select mb-3" id="ciudad"></select>

                    <button class="btn btn-primary w-100" type="button" id="btn-consultar">Consultar clima</button>
                </form>
            </div>

            <div class="col-12 col-lg-8">
                <section class="panel clima-panel d-none" id="resultado-clima">
                    <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
                        <div>
                            <p class="text-uppercase text-primary fw-semibold mb-1">Clima actual</p>
                            <h3 class="h3 mb-1" id="nombre-ciudad"></h3>
                            <p class="text-muted mb-0" id="descripcion-clima"></p>
                        </div>
                        <div class="temperatura-principal" id="temperatura"></div>
                    </div>

                    <div class="row g-3 mt-2">
                        <article class="col-12 col-md-4">
                            <div class="dato-clima">
                                <span>Sensacion</span>
                                <strong id="sensacion"></strong>
                            </div>
                        </article>
                        <article class="col-12 col-md-4">
                            <div class="dato-clima">
                                <span>Humedad</span>
                                <strong id="humedad"></strong>
                            </div>
                        </article>
                        <article class="col-12 col-md-4">
                            <div class="dato-clima">
                                <span>Viento</span>
                                <strong id="viento"></strong>
                            </div>
                        </article>
                    </div>

                    <p class="text-muted small mb-0 mt-3" id="actualizacion"></p>
                </section>
            </div>
        </section>
    </main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./dominio/controladorClima.js"></script>
<script>
    document.querySelector(".menu-hamburguesa").addEventListener("click", function() {
    document.querySelector(".btnPrincipales").classList.toggle("menu-abierto");
});
</script>
</body>
</html>
